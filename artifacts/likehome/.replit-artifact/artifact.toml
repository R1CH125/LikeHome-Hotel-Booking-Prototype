kind = "web"
previewPath = "/"
title = "LikeHome Hotel Booking"
description = "A friendly hotel-booking web application for browsing stays, comparing rooms, making demo reservations, managing bookings, and earning rewards."
version = "1.0.0"
id = "artifacts/likehome"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19024

[services.development]
run = "pnpm --filter @workspace/likehome run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/likehome", "run", "build" ]
serve = "static"
publicDir = "artifacts/likehome/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19024"
BASE_PATH = "/"
