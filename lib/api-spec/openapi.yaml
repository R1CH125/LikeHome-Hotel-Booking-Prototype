openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LikeHome hotel booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: hotels
    description: Search and browse stays
  - name: bookings
    description: Reservation lifecycle
  - name: account
    description: Demo account and rewards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /hotels:
    get:
      operationId: listHotels
      tags: [hotels]
      summary: Search and filter hotels
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CheckIn"
        - $ref: "#/components/parameters/CheckOut"
        - $ref: "#/components/parameters/Guests"
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: roomType
          in: query
          schema: { type: string }
        - name: minRating
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_low, price_high, rating]
      responses:
        "200":
          description: Matching hotels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HotelSummary" }
  /hotels/{slug}:
    get:
      operationId: getHotel
      tags: [hotels]
      summary: Get hotel details and available rooms
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/CheckIn"
        - $ref: "#/components/parameters/CheckOut"
        - $ref: "#/components/parameters/Guests"
      responses:
        "200":
          description: Hotel details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelDetail" }
        "404":
          description: Hotel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/session:
    get:
      operationId: getSession
      tags: [account]
      summary: Get the current demo session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/signup:
    post:
      operationId: signUp
      tags: [account]
      summary: Create a demo account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpInput" }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Invalid signup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login:
    post:
      operationId: logIn
      tags: [account]
      summary: Log into a demo account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged-in session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logOut
      tags: [account]
      summary: End the demo session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List the current user's bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a demo reservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400":
          description: Booking validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get one booking
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Change a booking
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingUpdate" }
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400":
          description: Booking validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400":
          description: Cancellation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rewards:
    get:
      operationId: getRewards
      tags: [account]
      summary: Get reward balance and history
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rewards" }
components:
  parameters:
    Search:
      name: search
      in: query
      schema: { type: string }
    CheckIn:
      name: checkIn
      in: query
      schema: { type: string, format: date }
    CheckOut:
      name: checkOut
      in: query
      schema: { type: string, format: date }
    Guests:
      name: guests
      in: query
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    HotelSummary:
      type: object
      required: [id, slug, name, location, imageUrl, rating, startingPrice, description, amenities]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        location: { type: string }
        imageUrl: { type: string }
        rating: { type: number }
        startingPrice: { type: number }
        description: { type: string }
        amenities:
          type: array
          items: { type: string }
    Room:
      type: object
      required: [id, name, roomType, description, pricePerNight, guestCapacity, imageUrl, available]
      properties:
        id: { type: string }
        name: { type: string }
        roomType: { type: string }
        description: { type: string }
        pricePerNight: { type: number }
        guestCapacity: { type: integer }
        imageUrl: { type: string }
        available: { type: boolean }
    HotelDetail:
      allOf:
        - $ref: "#/components/schemas/HotelSummary"
        - type: object
          required: [images, rooms]
          properties:
            images:
              type: array
              items: { type: string }
            rooms:
              type: array
              items: { $ref: "#/components/schemas/Room" }
    Session:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        user:
          type: ["object", "null"]
          properties:
            id: { type: string }
            fullName: { type: string }
            email: { type: string }
            rewardPoints: { type: integer }
          required: [id, fullName, email, rewardPoints]
    SignUpInput:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    BookingInput:
      type: object
      required: [hotelSlug, roomId, checkIn, checkOut, guests, useReward]
      properties:
        hotelSlug: { type: string }
        roomId: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1 }
        useReward: { type: boolean }
    BookingUpdate:
      type: object
      required: [roomId, checkIn, checkOut, guests]
      properties:
        roomId: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1 }
    Booking:
      type: object
      required: [id, confirmationNumber, hotel, room, checkIn, checkOut, guests, nights, subtotal, rewardDiscount, total, status, paymentStatus, cancellationCharge, pointsExpected]
      properties:
        id: { type: string }
        confirmationNumber: { type: string }
        hotel: { $ref: "#/components/schemas/HotelSummary" }
        room: { $ref: "#/components/schemas/Room" }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer }
        nights: { type: integer }
        subtotal: { type: number }
        rewardDiscount: { type: number }
        total: { type: number }
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid, partially_refunded, refunded, failed]
        cancellationCharge: { type: number }
        pointsExpected: { type: integer }
        createdAt: { type: string, format: date-time }
    RewardTransaction:
      type: object
      required: [id, type, points, description, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [earned, redeemed, reversed, adjusted] }
        points: { type: integer }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    Rewards:
      type: object
      required: [balance, transactions]
      properties:
        balance: { type: integer }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/RewardTransaction" }

